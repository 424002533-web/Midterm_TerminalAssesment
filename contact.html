<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>JastineSITE</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="index.html">MyWebsite</a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html"><b>Home</b></a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="tools.html"><b>Tools</b></a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html"><b>Contact</b></a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<section class="py-5 contact-section">
    <div class="container">

        <h2 class="text-center mb-4"><b>Contact Us</b></h2>

        <div class="row justify-content-center">
            <div class="col-md-6 contact-box">

                <form id="contactForm">

                    <div class="mb-3">
                        <label class="form-label">Name:</label>
                        <input type="text" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email:</label>
                        <input type="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message:</label>
                        <textarea class="form-control" rows="4"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Submit
                    </button>

                </form>

            </div>
        </div>

    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
